name: Update ClaudeBar cask

# Keeps Casks/claudebar.rb pointed at the newest johnfoland/ClaudeBar release.
#
# This deliberately runs *here* rather than being pushed from the ClaudeBar
# repo: a workflow in that repo would need a personal access token to write to
# this one, whereas polling from this side works with the built-in GITHUB_TOKEN
# and no secrets at all. ClaudeBar's fork-release.yml can still send a
# repository_dispatch to skip the wait, but it is purely an optimisation.

on:
  schedule:
    # Hourly, off the hour — scheduled runs cluster (and get throttled) at :00.
    - cron: '17 * * * *'
  repository_dispatch:
    types: [claudebar-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workflow can propagate the cask but not itself: GitHub refuses a
      # GITHUB_TOKEN push that touches .github/workflows/**, so a change to the
      # canonical copy in ClaudeBar has to be copied across by hand (or by
      # re-running scripts/bootstrap-tap.sh).
      #
      # That gap is not theoretical. This tap ran a superseded copy for a day —
      # one that bailed out whenever the version was unchanged and so never
      # looked at the cask body — while every hourly run reported success. Two
      # separate cask fixes sat in ClaudeBar the whole time and never shipped.
      # Warn rather than rot quietly.
      - name: Warn if this workflow has drifted from the canonical copy
        run: |
          CANON="$RUNNER_TEMP/update-cask.yml"
          SELF=.github/workflows/update-cask.yml
          URL="https://raw.githubusercontent.com/johnfoland/ClaudeBar/mine/homebrew/$SELF"

          if ! curl --fail --silent --show-error --location -o "$CANON" "$URL"; then
            echo "::warning::Could not fetch the canonical workflow to compare against."
            exit 0
          fi

          if ! cmp -s "$CANON" "$SELF"; then
            echo "::warning::$SELF differs from ClaudeBar's canonical copy at homebrew/$SELF. GITHUB_TOKEN cannot push to .github/workflows, so copy it across by hand — until then this tap is running superseded logic."
          fi

      - name: Update cask if a newer release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CASK=Casks/claudebar.rb
          REPO=johnfoland/ClaudeBar

          # Highest version, not most recently published. `gh release list` is
          # ordered by recency, so taking [0] would walk the cask backwards if an
          # older version were ever published last. sort -V compares embedded
          # numbers numerically, so fork.10 sorts above fork.9.
          TAG="$(gh release list --repo "$REPO" --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false)
                      | .tagName | select(startswith("fork-v"))' \
            | sort -V | tail -1)"

          if [ -z "$TAG" ]; then
            echo "::notice::No fork-v* release published yet — nothing to do."
            exit 0
          fi

          VERSION="${TAG#fork-v}"
          CURRENT="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$CASK")"
          CURRENT_SHA="$(sed -n 's/^  sha256 "\(.*\)"$/\1/p' "$CASK")"

          if [ "$VERSION" = "$CURRENT" ]; then
            # Same release, so the digest cannot have changed — reuse it rather
            # than re-downloading 12MB every hour. The cask body may still have
            # changed upstream, which the comparison at the end catches.
            SHA256="$CURRENT_SHA"
          else
            # Belt and braces: never move the cask to an older version, even if
            # the release list is somehow out of order.
            NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)"
            if [ "$NEWEST" != "$VERSION" ]; then
              echo "::notice::Newest release $VERSION is older than the cask's $CURRENT — leaving it alone."
              exit 0
            fi

            ASSET="ClaudeBar-$VERSION.zip"
            URL="https://github.com/$REPO/releases/download/$TAG/$ASSET"
            echo "Updating $CURRENT -> $VERSION"

            # Hash the asset actually served from the release URL, rather than
            # trusting a digest published alongside it.
            if ! curl --fail --silent --show-error --location -o "$RUNNER_TEMP/$ASSET" "$URL"; then
              echo "::error::Release $TAG exists but $ASSET could not be downloaded from it."
              exit 1
            fi
            SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | cut -d' ' -f1)"
          fi

          # The cask body itself lives in the app repo, at homebrew/Casks/. Pull
          # the canonical copy and stamp the release into it, rather than only
          # rewriting two lines of whatever is already here — otherwise a change
          # to the cask (a new zap path, a postflight block) would never reach
          # the tap without someone re-running bootstrap-tap.sh by hand.
          TEMPLATE="$RUNNER_TEMP/claudebar.rb"
          if ! curl --fail --silent --show-error --location -o "$TEMPLATE" \
              "https://raw.githubusercontent.com/$REPO/mine/homebrew/Casks/claudebar.rb"; then
            echo "::error::Could not fetch the canonical cask from $REPO."
            exit 1
          fi

          # Anchored to the two-space indent these keys have inside the cask
          # block, so neither pattern can match anything else in the file.
          sed -i "s|^  version \".*\"$|  version \"$VERSION\"|" "$TEMPLATE"
          sed -i "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" "$TEMPLATE"

          # Re-read rather than assuming sed matched.
          test "$(sed -n 's/^  version "\(.*\)"$/\1/p' "$TEMPLATE")" = "$VERSION" \
            || { echo "::error::version rewrite did not take effect."; exit 1; }
          test "$(sed -n 's/^  sha256 "\(.*\)"$/\1/p' "$TEMPLATE")" = "$SHA256" \
            || { echo "::error::sha256 rewrite did not take effect."; exit 1; }

          if cmp -s "$TEMPLATE" "$CASK"; then
            echo "Cask is already up to date at $VERSION."
            exit 0
          fi

          cp "$TEMPLATE" "$CASK"

          if [ "$VERSION" = "$CURRENT" ]; then
            MESSAGE="claudebar: sync cask body at $VERSION"
          else
            MESSAGE="claudebar $VERSION"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git commit -m "$MESSAGE"
          git push
