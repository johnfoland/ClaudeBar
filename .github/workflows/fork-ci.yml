name: Fork CI

# Upstream's build.yml and tests.yml only trigger on `main` and `develop`, so
# work on `mine` would otherwise get no CI at all. This is the fork's own
# verification, kept deliberately thin: it just calls scripts/dev-build.sh, so
# there is one definition of "how this app is built" shared by CI and your Mac.
#
# Editing upstream's workflow files to add `mine` would work too, but those are
# upstream-owned files — a separate file keeps the fork's diff additive.

on:
  push:
    branches: [mine]
  pull_request:
    branches: [mine]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tuist
        run: brew install --cask tuist

      - name: Test
        run: ./scripts/dev-build.sh --test

      # Archives rather than plain-builds Release: same compile work, but it
      # also verifies the bundle that --install puts in /Applications, and
      # leaves a downloadable .app so you can try a build without a local
      # toolchain. This is the artifact a Homebrew cask would point at.
      - name: Package app
        run: ./scripts/dev-build.sh --zip --skip-generate

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBar-${{ github.sha }}
          path: .build/ClaudeBar-*.zip
          # .build is a dot-directory, and upload-artifact treats every path
          # component starting with "." as hidden and silently skips it. The
          # glob above matches only the packaged app, so this stays narrow.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
