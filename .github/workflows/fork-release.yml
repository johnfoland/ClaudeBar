name: Fork Release

# Publishes a build of this fork to GitHub Releases, which is what gives the
# Homebrew cask a stable download URL. Upstream's release.yml is left alone: it
# targets tddworks' signing identity, Sparkle appcast and GitHub Pages, none of
# which this fork has. This one only does what a cask needs.
#
# There is nothing to remember and nothing to tag: every push to `mine` that
# passes tests is built, versioned, released, and picked up by the tap. To get a
# change onto your Macs, merge it to `mine` and later run
#
#     brew upgrade --cask johnfoland/tap/claudebar
#
# Put [skip release] in a commit message to land something without publishing —
# useful for docs-only commits.
#
# The version is computed by scripts/next-version.sh rather than typed: it reads
# the upstream version from CHANGELOG.md and adds one to the highest existing
# fork release for that version. The tag it publishes under is `fork-v<version>`,
# created by this workflow. The `fork-v` prefix (not `v`) is what keeps a fork
# release from ever firing upstream's release.yml, which triggers on `v*`.
#
# Signing is secrets-gated. With no secrets set this produces an ad-hoc signed
# release, which the cask's postflight makes installable by clearing quarantine;
# add the four Apple secrets and the same workflow produces a notarized one that
# needs no such help. Nothing here needs changing when you make that switch.

on:
  push:
    branches: [mine]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave blank to compute the next one)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26

    # Docs-only commits should not mint a release. workflow_dispatch has no
    # head_commit, so it is allowed through before the message is inspected.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CFBundleVersion is a commit count

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          if [ -n "${OVERRIDE:-}" ]; then
            VERSION="$OVERRIDE"
            echo "Using the version supplied to workflow_dispatch."
          else
            VERSION="$(./scripts/next-version.sh)"
          fi
          [ -n "$VERSION" ] || { echo "Could not resolve a version."; exit 1; }

          # Releasing over an existing tag would silently do nothing useful, so
          # fail loudly instead. Reachable only via an override.
          if gh release view "fork-v$VERSION" >/dev/null 2>&1; then
            echo "::error::fork-v$VERSION already exists."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Install Tuist
        run: brew install --cask tuist

      # A release lands on real machines via Homebrew, so it runs the suite
      # first. Packaging then reuses the workspace this generates.
      - name: Test
        run: ./scripts/dev-build.sh --test

      # Imports the Developer ID certificate into a throwaway keychain, and
      # resolves the identity string that dev-build.sh will sign with. When the
      # secret is absent every later step still works — the build just stays
      # ad-hoc signed. Mirrors the keychain setup in upstream's release.yml and
      # reuses the same secret names, so configuring one configures both.
      - name: Import Developer ID certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::notice::No APPLE_CERTIFICATE_P12 secret set — building an ad-hoc signed release."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)
          # Without this, codesign blocks on a GUI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null 2>&1 || true

          if [ -n "$APP_IDENTITY" ]; then
            IDENTITY="$APP_IDENTITY"
          else
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID" | head -1 | awk -F '"' '{print $2}')"
          fi
          [ -n "$IDENTITY" ] || { echo "Certificate imported but no Developer ID identity found."; exit 1; }

          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Signing as: $IDENTITY"

      - name: Package
        id: package
        env:
          CLAUDEBAR_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./scripts/fork-release.sh "${{ steps.version.outputs.version }}" --universal --skip-generate

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          NOTARIZED: ${{ steps.package.outputs.notarized }}
        run: |
          # The install command is the same either way: the cask's postflight
          # clears the quarantine attribute, so an ad-hoc build needs no flags.
          # Only the note about what the signature actually is differs.
          INSTALL_CMD='brew install --cask johnfoland/tap/claudebar'

          if [ "$NOTARIZED" = "true" ]; then
            INSTALL_NOTE=$'Signed with a Developer ID and notarized by Apple.'
          else
            INSTALL_NOTE=$'This build is **ad-hoc signed**, not notarized. The cask clears the quarantine attribute on install so Gatekeeper does not block it; if you would rather that were explicit, install with `HOMEBREW_CASK_OPTS=--no-quarantine` and drop the postflight block from the cask.'
          fi

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Fork build of ClaudeBar, published so the Homebrew tap has something stable to point at.

          ## Install

          \`\`\`bash
          $INSTALL_CMD
          \`\`\`

          The name is fully qualified on purpose. Upstream ClaudeBar is in
          \`homebrew/cask\`, so a bare \`brew install --cask claudebar\` installs
          *their* build, not this fork's. The qualified form auto-taps, so there
          is no separate \`brew tap\` step.

          $INSTALL_NOTE

          ## Verify the download

          \`\`\`
          sha256  $SHA256
          \`\`\`

          Sparkle's automatic update check is disabled in fork builds — the bundled
          appcast points at upstream and would otherwise replace this with a stock
          release. Homebrew handles updates instead:
          \`brew upgrade --cask johnfoland/tap/claudebar\`.
          EOF

          # --target creates the fork-v tag at this commit. Nothing pushes a tag
          # by hand any more; the release is what mints it.
          gh release create "fork-v$VERSION" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "ClaudeBar $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # Optional. The tap re-checks on a schedule anyway, so this only shortens
      # the gap between publishing a release and the cask pointing at it. Needs
      # a PAT with `contents: write` on the tap repo, since GITHUB_TOKEN is
      # scoped to this repository alone.
      - name: Nudge the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Gated on the value rather than on `if: secrets.X != ''` — the
          # secrets context is not in GitHub's availability table for a
          # step-level if, so that condition is not reliable.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN set — the tap will pick this release up on its next hourly check."
            exit 0
          fi
          gh api repos/johnfoland/homebrew-tap/dispatches \
            -f event_type=claudebar-release \
            || echo "::warning::Could not notify the tap; it will pick this up on its next scheduled check."
